<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIFT</title>
<meta name="description" content="How the SIFT photo cleanup app handles your data. Your photos never leave your device.">
<meta name="color-scheme" content="light dark">
<style>
:root {
  --ground: #f7f2e6;
  --panel: #fffdf7;
  --ink: #2a2110;
  --soft: #6b5c3e;
  --rule: #e2d6bb;
  --link: #6f7d2a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground: #17140d;
    --panel: #1f1b12;
    --ink: #ece4d2;
    --soft: #b3a686;
    --rule: #362f20;
    --link: #a8b862;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font: 17px/1.65 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
main {
  max-width: 43rem;
  margin: 0 auto;
  padding: 3.5rem 1.25rem 5rem;
}
h1, h2, h3 {
  font-family: ui-serif, Georgia, "Times New Roman", serif;
  line-height: 1.2;
  text-wrap: balance;
  margin: 2.4rem 0 0.6rem;
}
h1 { font-size: 2.3rem; margin-top: 0; letter-spacing: -0.01em; }
h2 { font-size: 1.45rem; padding-top: 1.2rem; border-top: 1px solid var(--rule); }
h3 { font-size: 1.12rem; color: var(--soft); }
p, ul { margin: 0.85rem 0; }
ul { padding-left: 1.15rem; }
li { margin: 0.4rem 0; }
strong { font-weight: 650; }
em { color: var(--soft); }
code {
  font: 0.9em ui-monospace, SFMono-Regular, Menlo, monospace;
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 0.05em 0.35em;
}
a { color: var(--link); text-decoration-thickness: 1px; text-underline-offset: 2px; }
a:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; border-radius: 2px; }
hr { border: 0; border-top: 1px solid var(--rule); margin: 2.2rem 0; }
h1 + p em { font-size: 0.95rem; }
</style>
</head>
<body>
<main>
<h1>SIFT</h1>
<p>A photo cleanup app for Android and iPhone. You swipe through your own library and decide what stays.</p>
<p><strong>Your photos never leave your device.</strong></p>
<p><a href="./privacy/">Privacy policy</a> &middot; <a href="./support/">Support</a></p>
<hr>
<p><em>support@siftappstudios.com</em></p>
</main>
</body>
</html>
