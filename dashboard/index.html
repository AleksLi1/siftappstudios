<style>
:root {
  --ground: #e7eaec;
  --ink: #27303a;
  --soft: #5d6976;
  --line: #b9c1c8;
  --hair: #d2d8dd;
  --track: #d3d9de;
  --sun: #b8964f;
  --ok: #3c7357;
  --warn: #8a5a12;
  --bad: #a3352c;
  --wash: rgba(93, 105, 118, 0.1);
  --select: rgba(184, 150, 79, 0.32);
  --gutter: clamp(1rem, 4.2vw, 3.5rem);
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground: #161b21;
    --ink: #d9dfe4;
    --soft: #919da8;
    --line: #38414a;
    --hair: #262d35;
    --track: #262e36;
    --sun: #cdae68;
    --ok: #7db897;
    --warn: #d9a44e;

}
@media (max-width: 560px) { :root { --gutter: 16px; } }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--ground); scrollbar-color: var(--line) var(--ground); }
::selection { background: var(--select); color: var(--ink); }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  background: var(--ground);
  color: var(--ink);
  font-family: "Newsreader", "Iowan Old Style", Georgia, serif;
  font-optical-sizing: auto;
  font-weight: 400;
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
a, .link {
  color: inherit;
  text-decoration-line: underline;
  text-decoration-color: var(--line);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.2em;
  transition: text-decoration-color 0.25s ease;
}
a:hover, .link:hover { text-decoration-color: currentColor; }
a:focus-visible, button:focus-visible, summary:focus-visible {
  outline: 1px solid var(--ink); outline-offset: 4px; border-radius: 2px;
}
.link { font: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.link:disabled { color: var(--soft); cursor: default; }
[hidden] { display: none !important; }
.vh { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

header, main {
  width: 100%;
  max-width: 82rem;
  margin: 0 auto;
  padding-left: var(--gutter);
  padding-right: var(--gutter);
}
header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 0.25rem 1.5rem;
  padding-top: 1.6rem;
}
.firm { margin: 0; font-size: 1.1875rem; letter-spacing: 0.01em; }
.firm a { text-decoration: none; }
.firm a:hover { text-decoration: underline; text-decoration-color: var(--line); }
nav { display: flex; flex-wrap: wrap; gap: 0.25rem 1.5rem; color: var(--soft); font-size: 0.9375rem; }
main { flex: 1; padding-bottom: 4rem; }
h1 {
  margin: 2.6rem 0 0.6rem;
  font-size: clamp(2.5rem, 1.6rem + 3.2vw, 4.25rem);
  font-weight: 250;
  line-height: 1;
  letter-spacing: -0.03em;
  text-wrap: balance;
}
footer { padding: 1.5rem 1rem 2rem; text-align: center; color: var(--soft); font-size: 0.8125rem; }
footer p { margin: 0; }
.tn { font-variant-numeric: lining-nums tabular-nums; }

/* ---------------------------------------------------------------- sign-in */
.gate { padding: 1.25rem 0 3rem; }
.gsi { min-height: 44px; }
/* Google's button document is light; an iframe whose scheme differs gets an opaque white backdrop. */
.gsi iframe { color-scheme: light; }
.gate-msg { margin: 1rem 0 0; max-width: 34rem; min-height: 1.45em; }
.gate-msg.err { color: var(--bad); }
.stub-gsi {
  font: inherit; font-size: 0.9375rem; color: var(--ink); background: transparent;
  border: 1px solid var(--line); border-radius: 4px; padding: 0.55rem 1rem; cursor: pointer;
}

/* ---------------------------------------------------------------- notices */
.notices:empty { display: none; }
.notice { margin: 0 0 0.4rem; color: var(--warn); max-width: 48rem; }

/* ---------------------------------------------------------------- what is wrong */
.asof { margin: 0; color: var(--soft); font-size: 0.9375rem; }
.mark { flex: none; display: inline-block; width: 0.5rem; height: 0.5rem; border-radius: 1px; background: var(--bad); }
.mark.warn { background: var(--warn); border-radius: 50%; }
.problems { list-style: none; margin: 1.4rem 0 0; padding: 0; max-width: 52rem; border-top: 1px solid var(--line); }
.problem {
  display: grid;
  grid-template-columns: 0.85rem minmax(0, 1fr) auto;
  column-gap: 0.5rem;
  align-items: baseline;
  padding: 0.6rem 0;
  border-bottom: 1px solid var(--hair);
}
.problem .mark { align-self: start; margin-top: 0.5em; }
.where { font-weight: 500; margin-right: 0.4rem; }
.ptext { overflow-wrap: anywhere; }
.pwhen { color: var(--soft); font-size: 0.875rem; white-space: nowrap; text-align: right; }

/* ---------------------------------------------------------------- the accounts */
.accounts {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  margin-top: 2.8rem;
  border-top: 1px solid var(--line);
}
.acct { min-width: 0; padding: 1.2rem 0 2rem; }
.acct + .acct { border-top: 1px solid var(--hair); }
@media (min-width: 940px) {
  .accounts { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .acct { padding: 1.2rem 2rem 0.4rem; }
  .acct:first-child { padding-left: 0; }
  .acct:last-child { padding-right: 0; }
  .acct + .acct { border-top: 0; border-left: 1px solid var(--hair); }
  .what { min-height: 2.9em; }
}
.acct h2 { margin: 0; font-size: 1.625rem; font-weight: 400; line-height: 1.15; letter-spacing: -0.005em; }
.what { margin: 0.2rem 0 0; font-size: 0.9375rem; color: var(--soft); }
.value { margin: 1.1rem 0 0; font-size: 2.125rem; font-weight: 300; line-height: 1.1; letter-spacing: -0.015em; }
.value.none { font-size: 1.375rem; color: var(--soft); }
.aprob { margin: 0.5rem 0 0; display: flex; gap: 0.5rem; align-items: baseline; color: var(--bad); overflow-wrap: anywhere; }
.aprob .mark { align-self: center; }
.moves { display: grid; grid-template-columns: max-content max-content max-content; gap: 0.15rem 1.1rem; margin: 0.7rem 0 0; }
.moves div { display: contents; }
.moves dt { color: var(--soft); }
.moves dd { margin: 0; text-align: right; }
.up { color: var(--ok); }
.down { color: var(--bad); }

.chart { position: relative; width: 100%; margin: 1.1rem 0 0; touch-action: pan-y; }
.chart.h-acct { height: 128px; }
.chart.h-ruler { height: 40px; margin-top: 1.3rem; }
.chart svg { display: block; overflow: visible; }
.chart text { fill: var(--soft); font-size: 12px; font-family: "Newsreader", "Iowan Old Style", Georgia, serif; font-variant-numeric: lining-nums tabular-nums; }
.chart text.end { fill: var(--ink); }
.grid line { stroke: var(--hair); stroke-width: 1; }
.ref { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 3; }
.ln { fill: none; stroke-width: 1.75; stroke-linejoin: round; stroke-linecap: round; }
.ln-live { stroke: var(--ink); }
.pt-live { fill: var(--ink); stroke: var(--ground); stroke-width: 2; }
.pt-open { fill: var(--ground); stroke: var(--ink); stroke-width: 1.5; }
.cross { stroke: var(--soft); stroke-width: 1; }
.hit { fill: transparent; cursor: crosshair; }
.tip {
  position: absolute; top: 0; left: 0; z-index: 2; pointer-events: none;
  padding: 0.3rem 0.55rem; background: var(--ground); border: 1px solid var(--line); border-radius: 3px;
  font-size: 0.8125rem; line-height: 1.35; white-space: nowrap; font-variant-numeric: lining-nums tabular-nums;
}
.tip b { font-weight: 500; }
.tip .k { color: var(--soft); }
.r-track { fill: var(--track); }
.r-fill { fill: var(--soft); }
.r-fill.low { fill: var(--bad); }
.r-tick { stroke: var(--soft); stroke-width: 1; }
.room { margin: 0.35rem 0 0; font-size: 0.9375rem; }
.cap { margin: 0.25rem 0 0; font-size: 0.8125rem; color: var(--soft); }

.holds { margin: 1.2rem 0 0; }
.holds h3 { margin: 0 0 0.2rem; font-size: 0.9375rem; font-weight: 500; }
.holds ul { list-style: none; margin: 0; padding: 0; }
.holds li { padding: 0.2rem 0; border-bottom: 1px solid var(--hair); overflow-wrap: anywhere; }
.holds li:last-child { border-bottom: 0; }
.holds .side { color: var(--soft); margin-left: 0.4rem; }
.flat { margin: 0; color: var(--soft); }
.read { margin: 1rem 0 0; font-size: 0.8125rem; color: var(--soft); }

/* ---------------------------------------------------------------- activity */
.activity { margin-top: 2.6rem; border-top: 1px solid var(--line); padding-top: 0.9rem; }
.log { max-width: 52rem; }
summary { cursor: pointer; font-size: 1.0625rem; width: fit-content; }
summary .n { color: var(--soft); margin-left: 0.35rem; }
summary:hover .n { color: var(--ink); }
details[open] > summary { margin-bottom: 0.5rem; }
.log { list-style: none; margin: 0; padding: 0; }
.log li {
  display: grid;
  grid-template-columns: 0.85rem 6.6rem minmax(0, 1fr);
  column-gap: 0.5rem;
  align-items: baseline;
  padding: 0.35rem 0;
  border-bottom: 1px solid var(--hair);
  font-size: 0.9375rem;
}
.log li:last-child { border-bottom: 0; }
.log .mark { align-self: start; margin-top: 0.5em; }
.log time { color: var(--soft); white-space: nowrap; }
.log .ltext { overflow-wrap: anywhere; }
.log .times { color: var(--soft); margin-left: 0.4rem; white-space: nowrap; }
.empty { margin: 0.2rem 0 0; color: var(--soft); }
.err { margin: 0.5rem 0 0; color: var(--bad); overflow-wrap: anywhere; }
.deploy { margin: 2rem 0 0; font-size: 0.8125rem; color: var(--soft); overflow-wrap: anywhere; }

@media (max-width: 560px) {
  header { padding-top: 1.1rem; }
  .firm { font-size: 1.0625rem; }
  nav { font-size: 0.875rem; gap: 0.25rem 1.25rem; }
  h1 { margin-top: 2rem; }
  .problem { grid-template-columns: 0.85rem minmax(0, 1fr); }
  .pwhen { grid-column: 2; text-align: left; }
  .log li { grid-template-columns: 0.85rem minmax(0, 1fr); }
  .log time { grid-column: 2; font-size: 0.8125rem; }
  .log .ltext { grid-column: 2; }
}
</style>

<script>

  function isObj(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }

      if (k === 'class') el.className = v;

  // The bot writes for Telegram: its emoji go, the words stay.
  function plain(v) {
    return txt(v).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{23E9}-\u{23FA}\u{FE0F}\u{200D}]/gu, '')
      .replace(/\s{2,}/g, ' ').trim();
  }

  function digits(v, dp) {
    return Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: dp, maximumFractionDigits: dp });
  }
  function signOf(v, dp, signed) {
    if (Number(Math.abs(v).toFixed(dp)) === 0) return '';

    return signOf(v, dp, signed) + digits(v, dp);
  }
  function sym(ccy) { return SYM[ccy] || (typeof ccy === 'string' && ccy ? ccy + '\u00a0' : ''); }
  function money(v, ccy, dp, signed) {

    if (dp == null) dp = 2;
    return signOf(v, dp, signed) + sym(ccy) + digits(v, dp);
  }
  function pct(v, dp) {
    if (!num(v)) return '—';
    return fnum(v * 100, dp == null ? 2 : dp, true) + '%';
  }
  function tone(v) { return !num(v) || Math.abs(v) < 5e-5 ? null : v > 0 ? 'up' : 'down'; }

  function parseT(iso) {
    if (typeof iso !== 'string') return null;
    var t = Date.parse(iso);

  }
  var fmtCache = {};
  function parts(t, opts, zone) {
    var key = JSON.stringify(opts) + zone;
    var f = fmtCache[key] || (fmtCache[key] = new Intl.DateTimeFormat('en-GB', Object.assign({ timeZone: zone }, opts)));
    var out = {};
    f.formatToParts(new Date(t)).forEach(function (p) { out[p.type] = p.value; });
    return out;
  }
  // "Sat 24 Oct 10:05 ET"
  function whenET(iso, secs) {
    var t = parseT(iso);
    if (t == null) return '—';
    var p = parts(t, { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', second: secs ? '2-digit' : undefined, hourCycle: 'h23' }, ET);
    return p.weekday + ' ' + p.day + ' ' + p.month + ' ' + p.hour + ':' + p.minute + (secs ? ':' + p.second : '') + ' ET';
  }
  // "Fri 15:59" in New York, for the log.
  function dayTime(iso) {
    var t = parseT(iso);
    if (t == null) return '—';
    var p = parts(t, { weekday: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }, ET);
    return p.weekday + ' ' + p.hour + ':' + p.minute;
  }
  function todayET() {
    var p = parts(Date.now(), { year: 'numeric', month: '2-digit', day: '2-digit' }, ET);

  }
  // A session date, "Fri 23 Oct" ("23 Oct" short).
  function day(d, short) {

  }
  function ago(ms) {

  function times(n) { return n === 2 ? 'twice' : n + ' times'; }

  // Text width for chart layout, in the page's own face.
  var measureCtx = null;
  function tw(str) {

    return measureCtx.measureText(str).width;

  // ------------------------------------------------------------------ network
  function call(method, path, body) {

  function setView(v) {

  function setMsg(m, isError) {

  }

  function load() {
    if (busy) return Promise.resolve();
    busy = true;
    lastTry = Date.now();
    return call('GET', '/api/dash/data').then(function (r) {

  // ---- the value at each session's mark, and now

    var vals = rows.map(function (r) { return r.value; });

    return chart('h-acct', label, function (el, w) {

  // ---- FTMO: where the equity sits between FTMO's floor and the target

    var label = 'Equity ' + money(v, ccy, 0) + ' between FTMO\u2019s floor ' + money(r.floor, ccy, 0) +
      (hasT ? ' and the target ' + money(r.target, ccy, 0) : '') + '.';
    var box = h('div', null,
      chart('h-ruler', label, function (el, w) { drawRuler(el, w, r, v, ccy); }),

  function drawRuler(el, W, r, v, ccy) {
    var hasT = num(r.target) && r.target > r.floor;
    var lo = r.floor, hi = hasT ? r.target : Math.max(r.start, v) + (r.start - r.floor) * 0.25;
    var X = function (x) { return Math.max(0, Math.min(1, (x - lo) / (hi - lo))) * W; };
    var H = 40, y = 6, th = 6;
    var svg = s('svg', { width: W, height: H, viewBox: '0 0 ' + W + ' ' + H, 'aria-hidden': 'true' });
    svg.appendChild(s('rect', { x: 0, y: y, width: W, height: th, rx: th / 2, class: 'r-track' }));

    svg.appendChild(s('rect', { x: 0, y: y, width: Math.max(th, X(v)).toFixed(1), height: th, rx: th / 2, class: 'r-fill' + (low ? ' low' : '') }));
    svg.appendChild(s('line', { x1: X(r.start).toFixed(1), x2: X(r.start).toFixed(1), y1: y - 4, y2: y + th + 4, class: 'r-tick' }));
    if (hasT) svg.appendChild(s('line', { x1: W - 0.5, x2: W - 0.5, y1: y - 4, y2: y + th + 4, class: 'r-tick' }));
    svg.appendChild(s('circle', { cx: X(v).toFixed(1), cy: y + th / 2, r: 5.5, class: 'pt-live' }));

    svg.appendChild(s('text', { x: 0, y: ty }, left));
    if (right) svg.appendChild(s('text', { x: W, y: ty, 'text-anchor': 'end' }, right));
    if (mx - mw / 2 > tw(left) + 12 && mx + mw / 2 < W - (right ? tw(right) : 0) - 12) {
      svg.appendChild(s('text', { x: mx.toFixed(1), y: ty, 'text-anchor': 'middle' }, mid));
    }
    el.replaceChildren(svg);
  }

  // ---- the log

  function chart(cls, label, draw) {

  function niceTicks(lo, hi, count) {
    if (!(hi > lo)) { var pad = Math.abs(lo) * 0.01 || 1; lo -= pad; hi += pad; }
    var raw = (hi - lo) / count, mag = Math.pow(10, Math.floor(Math.log10(raw))), e = raw / mag;
    var step = (e >= 7.5 ? 10 : e >= 3.5 ? 5 : e >= 1.5 ? 2 : 1) * mag;
    var t0 = Math.floor(lo / step + 1e-9) * step, t1 = Math.ceil(hi / step - 1e-9) * step;
    var out = [];
    for (var v = t0; v <= t1 + step / 2; v += step) out.push(Math.abs(v) < step / 1e6 ? 0 : +v.toPrecision(12));
    return { lo: t0, hi: t1, step: step, ticks: out };

  function moneyTick(step, maxAbs, ccy) {
    if (maxAbs >= 10000 && step >= 500) {

      return function (v) { return signOf(v, 6, false) + sym(ccy) + digits(v / 1000, dp) + 'K'; };
    }
    var d = step >= 1 ? 0 : step >= 0.1 ? 1 : 2;
    return function (v) { return money(v, ccy, d); };
  }
  function pathOf(xs, ys) {
    var d = '', pen = false;
    for (var i = 0; i < xs.length; i++) {
      if (ys[i] == null) { pen = false; continue; }
      d += (pen ? 'L' : 'M') + xs[i].toFixed(1) + ' ' + ys[i].toFixed(1);
      pen = true;
    }
    return d;
  }
  function lastIdx(vals) { for (var i = vals.length - 1; i >= 0; i--) if (num(vals[i])) return i; return -1; }
  function pickLabels(labels, X) {
    var n = labels.length, gap = 10, out = [];
    if (!n) return out;
    var widest = Math.max.apply(null, labels.map(tw)) + gap;
    var span = n > 1 ? X(n - 1) - X(0) : 0;
    var room = n > 1 ? Math.max(1, Math.floor(span / widest)) : 0;
    var step = n > 1 ? Math.max(1, Math.ceil((n - 1) / room)) : 1;
    // Where each label really sits: the first starts at its point, the last ends at it, the rest are centred.
    function extent(i) {

      if (n > 1 && i === 0) return [x, x + w];
      if (n > 1 && i === n - 1) return [x - w, x];

    for (var i = 0; i < n - 1; i += step) {
      var e = extent(i);
      if (e[0] < lastR + gap || e[1] > endL - gap) continue;
      out.push(i);
      lastR = e[1];
    }
    out.push(n - 1);
    return out;
  }

  // A line over discrete sessions with a crosshair readout.
  function drawLines(el, W, o) {
    var H = o.height, n = o.labels.length, ccy = o.ccy;
    var all = [];
    o.series.forEach(function (se) { se.vals.forEach(function (v) { if (num(v)) all.push(v); }); });
    if (num(o.ref)) all.push(o.ref);
    if (!all.length) { el.replaceChildren(h('p', { class: 'empty' }, 'Nothing to draw yet.')); return; }
    var T = niceTicks(Math.min.apply(null, all), Math.max.apply(null, all), 3);
    var yfmt = moneyTick(T.step, Math.max(Math.abs(T.lo), Math.abs(T.hi)), ccy);
    var ylab = T.ticks.map(yfmt);
    var padL = Math.ceil(Math.max.apply(null, ylab.map(tw))) + 10;
    var padR = 8, padT = 8, padB = 24;
    var pw = Math.max(40, W - padL - padR), ph = H - padT - padB;
    var X = function (i) { return padL + (n === 1 ? pw / 2 : i * pw / (n - 1)); };
    var Y = function (v) { return padT + ph - (v - T.lo) / (T.hi - T.lo) * ph; };
    var svg = s('svg', { width: W, height: H, viewBox: '0 0 ' + W + ' ' + H, 'aria-hidden': 'true' });
    var grid = s('g', { class: 'grid' });
    T.ticks.forEach(function (t, k) {
      grid.appendChild(s('line', { x1: padL, x2: padL + pw, y1: Y(t).toFixed(1), y2: Y(t).toFixed(1) }));
      grid.appendChild(s('text', { x: padL - 8, y: Y(t).toFixed(1), 'text-anchor': 'end', dy: '0.32em' }, ylab[k]));
    });
    svg.appendChild(grid);
    pickLabels(o.labels, X).forEach(function (i) {
      var anchor = n > 1 && i === 0 ? 'start' : n > 1 && i === n - 1 ? 'end' : 'middle';
      svg.appendChild(s('text', { x: X(i).toFixed(1), y: H - 6, 'text-anchor': anchor }, o.labels[i]));
    });
    if (num(o.ref)) svg.appendChild(s('line', { x1: padL, x2: padL + pw, y1: Y(o.ref).toFixed(1), y2: Y(o.ref).toFixed(1), class: 'ref' }));
    var xs = o.labels.map(function (_, i) { return X(i); });
    o.series.forEach(function (se) {
      var ys = se.vals.map(function (v) { return num(v) ? Y(v) : null; });
      var li = lastIdx(se.vals);
      if (se.openLast && li > 0) {
        // The last point is now, not a finished session: dotted, with an open dot.
        svg.appendChild(s('path', { d: pathOf(xs.slice(0, li), ys.slice(0, li)), class: 'ln ln-' + se.cls }));
        var pi = lastIdx(se.vals.slice(0, li));
        if (pi >= 0) svg.appendChild(s('path', { d: 'M' + xs[pi].toFixed(1) + ' ' + ys[pi].toFixed(1) + 'L' + xs[li].toFixed(1) + ' ' + ys[li].toFixed(1), class: 'ln ln-' + se.cls, 'stroke-dasharray': '2 3' }));
        svg.appendChild(s('circle', { cx: xs[li].toFixed(1), cy: ys[li].toFixed(1), r: 4, class: 'pt-open' }));
      } else if (li >= 0) {
        svg.appendChild(s('path', { d: pathOf(xs, ys), class: 'ln ln-' + se.cls }));
        svg.appendChild(s('circle', { cx: xs[li].toFixed(1), cy: ys[li].toFixed(1), r: 3.5, class: 'pt-' + se.cls }));
      }
    });

    var cross = s('line', { y1: padT, y2: padT + ph, class: 'cross', visibility: 'hidden' });
    svg.appendChild(cross);
    var hit = s('rect', { x: padL - 6, y: 0, width: pw + 12, height: H, class: 'hit' });
    svg.appendChild(hit);
    var tip = h('div', { class: 'tip', hidden: true });
    function showAt(clientX) {
      var r = svg.getBoundingClientRect();
      var i = n === 1 ? 0 : Math.max(0, Math.min(n - 1, Math.round((clientX - r.left - padL) / (pw / (n - 1)))));
      cross.setAttribute('x1', X(i).toFixed(1));
      cross.setAttribute('x2', X(i).toFixed(1));
      cross.setAttribute('visibility', 'visible');
      tip.replaceChildren(h('div', { class: 'k' }, (o.tips || o.labels)[i]));
      o.series.forEach(function (se) { tip.appendChild(h('div', null, h('b', null, money(se.vals[i], ccy, 2)))); });
      tip.hidden = false;
      var w0 = tip.offsetWidth, left = X(i) + 12;
      if (left + w0 > W) left = X(i) - 12 - w0;
      tip.style.transform = 'translate(' + Math.max(0, left).toFixed(0) + 'px, ' + padT + 'px)';
    }
    function hide() { cross.setAttribute('visibility', 'hidden'); tip.hidden = true; }
    hit.addEventListener('pointermove', function (e) { showAt(e.clientX); });
    hit.addEventListener('pointerdown', function (e) { showAt(e.clientX); });
    hit.addEventListener('pointerleave', hide);
    el.replaceChildren(svg, tip);
  }

  // ------------------------------------------------------------------ start
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (view === 'board') redrawCharts(); });
  setView('loading');
  load();
  setInterval(function () { if (view === 'board') tick(); }, 15000);
  setInterval(function () {
    if (document.visibilityState === 'visible' && (view === 'board' || view === 'down')) load();
  }, 60000);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    if ((view === 'board' || view === 'down') && Date.now() - lastTry > 55000) load();
    if (view === 'gate' && gisReady && Date.now() - nonceAt > 9 * 60 * 1000) startSignIn({ prompt: false });
    if (view === 'board') tick();
  });
})();
</script>
</body>
</html>
